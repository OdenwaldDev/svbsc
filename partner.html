<!DOCTYPE html>
<html lang="de"><head><meta data-schutz="1" http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><meta name="referrer" content="no-referrer"><script>(function(){try{if(window.top!==window.self){var h=null;try{h=window.top.location.hostname;}catch(e){}if(h===null){document.documentElement.style.display='none';}}}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141b47">
<title>Partner werden · SV/BSC Mörlenbach</title>
<link rel="icon" href="favicon-64.png">
<style>
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url(partner/barlow-400.woff2) format('woff2');}
@font-face{font-family:'Barlow';font-weight:500;font-display:swap;src:url(partner/barlow-500.woff2) format('woff2');}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url(partner/barlow-600.woff2) format('woff2');}
@font-face{font-family:'Barlow';font-weight:700;font-display:swap;src:url(partner/barlow-700.woff2) format('woff2');}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(partner/barlowc-700.woff2) format('woff2');}
@font-face{font-family:'Barlow Condensed';font-weight:800;font-display:swap;src:url(partner/barlowc-800.woff2) format('woff2');}
@font-face{font-family:'Barlow Condensed';font-weight:900;font-display:swap;src:url(partner/barlowc-900.woff2) format('woff2');}
@font-face{font-family:'Caveat';font-weight:700;font-display:swap;src:url(partner/caveat-700.woff2) format('woff2');}
:root{--navy:#141b47;--blau:#1d2760;--or:#e8741f;--or2:#c95f10;--hb:#8fc9ec;--hb2:#b9d9f0;--papier:#f7f4ee;--papier2:#efe9dd;--ink:#1c1c22;--ink2:#3a3a44;--grau:#5b5b66;--linie:#d8d2c4;--gruen:#2c6b3a;
  --c:'Barlow Condensed','Arial Narrow',sans-serif;--h:'Caveat',cursive;--top:64px;}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:var(--top);}
body{margin:0;background:var(--navy);font-family:'Barlow',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
a{color:var(--or);}
input,select,textarea,button{font-family:inherit;}
button{-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:3px solid var(--or);outline-offset:2px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes rein{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes plopp{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.w{max-width:720px;margin:0 auto;}
.ww{max-width:1100px;margin:0 auto;}
.k{font-family:var(--c);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;}
.hand{font-family:var(--h);color:var(--or);line-height:1;}
h2.g{margin:10px 0 0;font-family:var(--c);font-weight:900;font-size:clamp(38px,8vw,64px);line-height:.92;text-transform:uppercase;text-wrap:balance;}
.lead{margin:16px 0 0;font-size:19px;line-height:1.55;color:var(--ink2);max-width:62ch;text-wrap:pretty;}
.dunkel .lead{color:#dbe4f2;}
.sec{padding:72px 20px;}
.hell{background:var(--papier);}
.dunkel{background:var(--navy);color:#fff;}
.blau{background:var(--blau);color:#fff;}
/* Kopfzeile */
.top{position:sticky;top:0;z-index:50;background:rgba(20,27,71,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.12);padding-top:env(safe-area-inset-top,0px);}
.top .ww{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.top-l{display:flex;align-items:center;gap:10px;min-width:0;}
.top-l>img{height:38px;width:auto;display:block;}
.top-x{color:var(--hb);font-family:var(--c);font-weight:800;font-size:18px;}
.top-p{height:38px;max-width:120px;background:#fff;padding:4px 8px;display:flex;align-items:center;}
.top-p img{max-height:30px;max-width:104px;width:auto;height:auto;}
.top-p.dk{background:transparent;padding:4px 0;}
.top-r{display:flex;align-items:center;gap:8px;}
.top-t{font-family:var(--c);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);background:var(--hb);padding:4px 8px;}
.top-b{min-height:44px;padding:0 14px;background:var(--or);border:0;color:#fff;font-family:var(--c);font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;}
.top-b i{font-style:normal;min-width:24px;height:24px;display:grid;place-items:center;background:#fff;color:var(--or2);font-size:15px;border-radius:12px;padding:0 6px;}
.top-b.plopp i{animation:plopp .45s ease;}
.prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--or);width:0;transition:width .15s linear;}
/* Hero */
.hero{position:relative;min-height:min(92svh,860px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;color:#fff;}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,27,71,.1) 0%,rgba(20,27,71,.55) 45%,#141b47 94%);}
.hero .ww{position:relative;z-index:1;width:100%;padding:0 20px 52px;}
.hero-f{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--blau);padding:8px 14px;font-family:var(--c);font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;max-width:100%;}
.hero-f span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hero h1{margin:10px 0 0;font-family:var(--c);font-weight:900;font-size:clamp(56px,12vw,128px);line-height:.86;text-transform:uppercase;text-wrap:balance;}
.hero p{margin:18px 0 0;font-size:20px;line-height:1.45;color:#e6ecf5;max-width:560px;text-wrap:pretty;}
.runter{margin-top:28px;display:inline-flex;align-items:center;gap:10px;color:var(--hb);background:none;border:0;padding:0;min-height:44px;cursor:pointer;}
/* Verein */
.fakten{margin-top:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;background:var(--linie);border:2px solid var(--linie);}
.fakten div{background:#fff;padding:20px 16px 18px;}
.fakten b{display:block;font-family:var(--c);font-weight:900;font-size:clamp(44px,7vw,64px);line-height:.9;color:var(--blau);font-variant-numeric:tabular-nums;}
.fakten span{display:block;margin-top:6px;font-size:15px;line-height:1.35;color:var(--grau);}
.saeulen{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px;}
.saeulen h3{margin:6px 0 0;font-family:var(--c);font-weight:900;font-size:28px;line-height:1;text-transform:uppercase;color:var(--blau);}
.saeulen p{margin:8px 0 0;font-size:16.5px;line-height:1.55;color:var(--ink2);}
.saeulen .n{font-family:var(--c);font-weight:900;font-size:16px;color:var(--or);letter-spacing:.1em;}
/* Passung */
.pa-kopf{display:flex;align-items:center;justify-content:center;gap:16px;background:#fff;padding:22px 18px;border-bottom:8px solid var(--or);box-shadow:0 18px 40px -24px rgba(20,27,71,.45);}
.pa-kopf .pl{max-height:84px;max-width:min(58%,300px);width:auto;height:auto;object-fit:contain;}
.pa-kopf .pl.dk{background:var(--navy);padding:12px 16px;}
.pa-kopf .sv{height:58px;width:auto;}
.pa-kopf i{font-style:normal;font-family:var(--c);font-weight:900;font-size:30px;color:var(--grau);}
.pa-text{margin:14px 0 0;font-size:18px;line-height:1.55;color:var(--ink2);text-wrap:pretty;}
.pa-p{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;}
.pa-p li{display:flex;gap:12px;font-size:17px;line-height:1.45;}
.pa-p li:before{content:"✓";color:var(--or);font-weight:900;flex:none;}
/* Fragen */
.fr{margin-top:34px;display:grid;gap:30px;}
.fr-k{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.fr-k b{font-family:var(--c);font-weight:900;font-size:24px;text-transform:uppercase;}
.fr-k small{font-size:14px;color:var(--hb2);}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;}
.chip{min-height:48px;padding:10px 16px;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-family:var(--c);font-weight:800;font-size:18px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;transition:background .2s,border-color .2s,color .2s;display:inline-flex;align-items:center;gap:8px;}
.chip:hover{border-color:#fff;}
.chip.on{background:var(--or);border-color:var(--or);}
.chip.on:before{content:"✓";}
.fr-n{margin-top:6px;min-height:24px;font-family:var(--h);font-size:26px;color:var(--hb);}
/* Welten */
.welt{position:relative;}
.welt-k{position:relative;display:grid;grid-template-columns:1fr;min-height:340px;overflow:hidden;}
.welt-bild{position:absolute;inset:0;}
.welt-bild img{width:100%;height:100%;object-fit:cover;display:block;}
.welt-bild:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,27,71,.92) 0%,rgba(20,27,71,.7) 45%,rgba(20,27,71,.15) 100%);}
.welt-t{position:relative;z-index:1;padding:64px 20px 40px;align-self:end;color:#fff;}
.welt-t h2{margin:8px 0 0;font-family:var(--c);font-weight:900;font-size:clamp(44px,9vw,92px);line-height:.88;text-transform:uppercase;text-wrap:balance;max-width:12ch;}
.welt-t p{margin:16px 0 0;font-size:19px;line-height:1.5;max-width:46ch;color:#e6ecf5;text-wrap:pretty;}
.welt-t .hand{font-size:30px;}
.welt-art{position:absolute;right:-20px;bottom:-10px;width:min(52%,520px);opacity:.95;pointer-events:none;}
.welt.zweite .welt-k{background:var(--papier2);}
.welt.zweite .welt-t{color:var(--blau);}
.welt.zweite .welt-t p{color:var(--ink2);}
.welt.events .welt-k{background:var(--or);}
.welt.events .welt-t p{color:#fff;}
.welt.events .welt-t .hand{color:var(--navy);}
.welt.verein .welt-k{background:var(--blau);}
.welt-in{padding:34px 20px 64px;background:var(--papier);}
.welt.zweite .welt-in{background:var(--papier2);}
.lks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.lk{position:relative;display:flex;flex-direction:column;gap:10px;background:#fff;border-top:6px solid var(--blau);padding:20px 18px 18px;box-shadow:0 14px 34px -24px rgba(20,27,71,.5);}
.lk.drin{border-top-color:var(--or);box-shadow:0 0 0 3px var(--or),0 14px 34px -24px rgba(20,27,71,.5);}
.lk.voll{opacity:.8;}
.lk-n{font-family:var(--c);font-weight:900;font-size:26px;line-height:1;text-transform:uppercase;color:var(--blau);text-wrap:balance;}
.lk-h{font-family:var(--h);font-size:24px;line-height:1.05;color:var(--or);}
.lk-x{margin:0;font-size:15.5px;line-height:1.5;color:var(--ink2);flex:1;}
.lk-p{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.lk-p b{font-family:var(--c);font-weight:900;font-size:38px;line-height:.9;color:var(--ink);font-variant-numeric:tabular-nums;}
.lk-p span{font-size:14px;color:var(--grau);}
.lk-f{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--grau);}
.lk-f i{width:8px;height:8px;border-radius:50%;background:var(--gruen);flex:none;}
.lk-f.eng{color:var(--or2);font-weight:800;} .lk-f.eng i{background:var(--or);animation:pulse 1.6s infinite;}
.lk-f.aus{color:#b0281a;} .lk-f.aus i{background:#b0281a;}
.lk-b{min-height:52px;border:2px solid var(--blau);background:#fff;color:var(--blau);font-family:var(--c);font-weight:900;font-size:19px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.lk-b.p{border-color:var(--or);background:var(--or);color:#fff;}
.lk.drin .lk-b{border-color:var(--or);background:#fff7f0;color:var(--or2);}
.lk-tag{position:absolute;top:-6px;right:14px;transform:translateY(-50%) rotate(-3deg);background:var(--or);color:#fff;font-family:var(--c);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;}
.lk-tag.b{background:var(--blau);}
/* Teams */
.teams{margin-bottom:22px;}
.teams-k{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.teams-k b{font-family:var(--c);font-weight:900;font-size:22px;text-transform:uppercase;color:var(--blau);}
.teams-k small{font-size:14px;color:var(--grau);}
.tms{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
.tm{min-width:62px;min-height:52px;padding:6px 10px;border:2px solid var(--linie);background:#fff;color:var(--blau);font-family:var(--c);font-weight:900;font-size:20px;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:4px;}
.tm small{font-family:'Barlow',sans-serif;font-weight:600;font-size:11px;text-transform:none;color:var(--grau);}
.tm.on{border-color:var(--blau);background:var(--blau);color:#fff;}
.tm.on small{color:var(--hb2);}
.tm.voll small{color:#b0281a;}
/* Weitere Welten */
.mehr{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:22px;}
.mz{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border:2px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer;min-height:110px;}
.mz b{font-family:var(--c);font-weight:900;font-size:26px;text-transform:uppercase;line-height:1;}
.mz span{font-size:15px;color:var(--hb2);line-height:1.4;}
.mz:hover{border-color:#fff;}
/* Vorschlag */
.vs{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.vs div{background:rgba(255,255,255,.08);border-top:5px solid var(--or);padding:16px;}
.vs b{display:block;font-family:var(--c);font-weight:900;font-size:24px;line-height:1;text-transform:uppercase;}
.vs small{display:block;margin-top:6px;font-size:14.5px;line-height:1.4;color:var(--hb2);}
.vs em{display:block;margin-top:10px;font-style:normal;font-family:var(--c);font-weight:900;font-size:26px;}
.vs-s{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.vs-s span{font-size:16px;color:var(--hb2);}
.vs-s b{font-family:var(--c);font-weight:900;font-size:36px;}
/* Knöpfe */
.knopf-o{min-height:60px;width:100%;border:0;background:var(--or);color:#fff;font-family:var(--c);font-weight:900;font-size:24px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;padding:0 18px;}
.knopf-w{min-height:56px;width:100%;border:2px solid #fff;background:transparent;color:#fff;font-family:var(--c);font-weight:900;font-size:20px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;padding:0 18px;}
.knopf-b{min-height:56px;width:100%;border:2px solid var(--blau);background:transparent;color:var(--blau);font-family:var(--c);font-weight:900;font-size:20px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;padding:0 18px;}
button:disabled{opacity:.55;cursor:not-allowed;}
/* Baukasten */
.korb{margin-top:28px;display:flex;flex-direction:column;gap:8px;}
.kp{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;background:#fff;border-left:6px solid var(--blau);padding:14px 16px;}
.kp-n b{display:block;font-family:var(--c);font-weight:900;font-size:22px;line-height:1.05;text-transform:uppercase;color:var(--blau);}
.kp-n small{display:block;margin-top:3px;font-size:14px;color:var(--grau);}
.kp-p{text-align:right;font-family:var(--c);font-weight:900;font-size:24px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.kp-p small{display:block;font-family:'Barlow',sans-serif;font-weight:500;font-size:12.5px;color:var(--grau);}
.kp-z{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.kp-z select,.kp-z input{min-height:44px;padding:0 10px;border:1.5px solid var(--linie);background:#fff;font-size:16px;color:var(--ink);}
.kp-z input{width:130px;}
.kp-z label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--grau);}
.kp-x{margin-left:auto;min-height:44px;border:0;background:none;color:#b0281a;font-weight:700;font-size:15px;cursor:pointer;padding:0 6px;}
.menge{display:flex;align-items:center;gap:8px;}
.menge button{width:44px;height:44px;border:1.5px solid var(--blau);background:#fff;color:var(--blau);font-size:22px;font-weight:700;cursor:pointer;}
.menge b{min-width:26px;text-align:center;font-family:var(--c);font-weight:900;font-size:24px;}
.leer{background:#fff;border:2px dashed var(--linie);padding:26px 20px;text-align:center;color:var(--grau);font-size:17px;line-height:1.5;}
.opts{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
.opt{min-height:68px;padding:10px;cursor:pointer;border:2px solid var(--linie);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;color:inherit;text-align:center;}
.opt.on{border-color:var(--or);background:#fff7f0;box-shadow:inset 0 0 0 1px var(--or);}
.opt b{font-family:var(--c);font-weight:900;font-size:22px;text-transform:uppercase;color:var(--blau);}
.opt small{font-size:13.5px;color:var(--grau);}
.unter{margin-top:40px;}
.unter .k{color:var(--grau);}
.sw{margin-top:12px;display:flex;align-items:center;gap:14px;min-height:52px;background:#fff;border:2px solid var(--linie);padding:10px 14px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;}
.sw .hak{width:28px;height:28px;flex:none;border:2px solid #8a8a94;background:#fff;color:#fff;display:grid;place-items:center;font-weight:900;}
.sw.on .hak{border-color:var(--or);background:var(--or);}
.sw span{font-size:16px;line-height:1.4;}
.sw small{display:block;font-size:13.5px;color:var(--grau);}
.sp{margin-top:12px;background:#fff;border:2px solid var(--linie);padding:16px;}
.sp-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.sp-b button{min-height:48px;min-width:72px;padding:0 14px;border:2px solid var(--linie);background:#fff;font-family:var(--c);font-weight:900;font-size:20px;color:var(--blau);cursor:pointer;}
.sp-b button.on{border-color:var(--or);background:var(--or);color:#fff;}
.sp-z{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center;}
.sp-z input,.sp-z select{min-height:48px;padding:0 12px;border:1.5px solid var(--linie);background:#fff;font-size:17px;}
.sp-z input{width:150px;}
.sonst{margin-top:12px;background:#fff;border:2px dashed var(--blau);padding:16px;display:grid;grid-template-columns:1fr 140px auto;gap:10px;align-items:end;}
.sonst label{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grau);font-weight:600;}
.sonst input{min-height:48px;padding:0 12px;border:1.5px solid var(--linie);font-size:17px;}
.sonst button{min-height:48px;padding:0 16px;border:0;background:var(--blau);color:#fff;font-family:var(--c);font-weight:900;font-size:18px;text-transform:uppercase;cursor:pointer;}
@media (max-width:560px){.sonst{grid-template-columns:1fr;}}
.summe{margin-top:28px;background:var(--blau);color:#fff;padding:22px;border-bottom:6px solid var(--or);}
.summe div{display:flex;justify-content:space-between;gap:12px;font-size:16px;padding:3px 0;}
.summe div span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;}
.summe .z{color:var(--hb2);}
.summe .s{align-items:baseline;}
.summe .s:not(:first-child){margin-top:12px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2);}
.summe .s b{font-family:var(--c);font-weight:900;font-size:40px;white-space:nowrap;}
.summe small{display:block;margin-top:10px;font-size:13px;color:var(--hb2);line-height:1.45;}
/* Abschluss */
.felder{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
.felder label{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hb);font-weight:600;}
.felder input,.felder select{min-height:50px;padding:0 12px;border:0;background:#fff;color:var(--ink);font-size:17px;border-radius:0;width:100%;}
.wahl2{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;}
.wahl2 button{display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px;min-height:120px;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer;}
.wahl2 button b{font-family:var(--c);font-weight:900;font-size:28px;line-height:1;text-transform:uppercase;}
.wahl2 button span{font-size:15.5px;line-height:1.45;color:var(--hb2);}
.wahl2 button.on{border-color:var(--or);background:rgba(232,116,31,.14);}
.wahl2 button.haupt{border-color:var(--or);}
.msg{margin-top:12px;font-size:16px;font-weight:600;color:var(--hb2);min-height:1em;}
.msg.err{color:#ffb4a8;}
.vertrag{margin-top:28px;background:#fff;color:var(--ink);border-top:10px solid var(--or);box-shadow:0 30px 60px -30px rgba(0,0,0,.6);}
.vt-k{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 22px 0;}
.vt-k b{font-family:var(--c);font-weight:900;font-size:30px;line-height:1;text-transform:uppercase;color:var(--blau);}
.vt-k small{display:block;margin-top:4px;font-size:14px;color:var(--grau);}
.vt-k img{height:48px;width:auto;}
.vt-p{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px 22px;font-size:15px;line-height:1.45;}
.vt-p span{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--grau);font-weight:700;margin-bottom:3px;}
@media (max-width:520px){.vt-p{grid-template-columns:1fr;}}
.vt-tab{margin:0 22px;border-top:2px solid var(--blau);}
.vt-tab div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--linie);font-size:15px;}
.vt-tab div span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;}
.vt-tab .s{font-weight:700;border-bottom:0;}
.vt-kl{margin:16px 22px 0;max-height:46vh;overflow:auto;border:1px solid var(--linie);padding:4px 16px 12px;background:#fcfbf8;-webkit-overflow-scrolling:touch;}
.vt-kl h4{margin:14px 0 4px;font-size:14.5px;color:var(--blau);}
.vt-kl p{margin:0;font-size:14px;line-height:1.55;color:var(--ink2);}
.vt-u{padding:18px 22px 24px;}
.zust{margin-top:4px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15.5px;line-height:1.45;background:none;border:0;text-align:left;padding:8px 0;color:inherit;font-family:inherit;min-height:44px;}
.zust .hak{width:28px;height:28px;flex:none;border:2px solid #8a8a94;background:#fff;color:#fff;display:grid;place-items:center;font-weight:900;}
.zust .hak.on{border-color:var(--or);background:var(--or);}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:10px;}
.sig-l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grau);font-weight:700;}
canvas.sig{margin-top:6px;width:100%;height:170px;background:#fff;border:1.5px dashed #8a8a94;touch-action:none;display:block;cursor:crosshair;}
.sig-f{margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;color:var(--grau);}
.sig-f button{border:0;background:none;color:var(--blau);font-weight:700;font-size:14px;cursor:pointer;min-height:44px;}
.sig-n{margin-top:6px;width:100%;min-height:44px;padding:0 10px;border:1.5px solid var(--linie);font-size:15px;}
.vt-u .msg{color:#b0281a;}
.danke{background:var(--or);color:#fff;padding:36px 24px;text-align:center;animation:rein .6s ease both;}
.danke b{display:block;font-family:var(--c);font-weight:900;font-size:clamp(44px,9vw,72px);line-height:.9;text-transform:uppercase;text-wrap:balance;}
.danke .hand{color:#fff;margin-top:12px;font-size:32px;}
.danke p{margin:14px auto 0;font-size:17.5px;line-height:1.55;max-width:52ch;}
.gc{margin-top:16px;background:#fff;color:var(--ink);display:grid;grid-template-columns:auto 1fr;gap:20px;padding:22px;align-items:center;}
.gc svg{display:block;width:180px;height:180px;}
.gc-t b{display:block;font-family:var(--c);font-weight:900;font-size:26px;text-transform:uppercase;color:var(--blau);}
.gc-t dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;}
.gc-t dt{color:var(--grau);}
.gc-t dd{margin:0;font-weight:600;word-break:break-word;}
@media (max-width:560px){.gc{grid-template-columns:1fr;justify-items:center;text-align:left;}}
.hinweis{margin-top:14px;font-size:14px;line-height:1.5;color:var(--hb2);}
footer{background:var(--navy);color:var(--hb2);padding:28px 20px calc(40px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.12);}
footer .ww{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;font-size:14px;line-height:1.5;}
footer .f-l{display:flex;align-items:center;gap:12px;}
footer img{height:40px;width:auto;}
.leer-hinweis{padding:120px 20px;color:#fff;text-align:center;}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:var(--blau);padding:12px 18px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:100;max-width:calc(100% - 32px);}
@media (max-width:640px){.welt-art{width:86%;right:-30px;opacity:.22;}}
@media (min-width:900px){.sec{padding:96px 32px;} .welt-t{padding:96px 32px 56px;} .welt-in{padding:40px 32px 80px;} .welt-k{min-height:440px;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;} html{scroll-behavior:auto;}}
</style>
